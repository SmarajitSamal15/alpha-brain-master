name: Airdrop Head Dept AI Labs Scan

on:
  schedule:
    # ⏱️Runs every 15 minutes automatically (UTC Time)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Enables manual run button for testing

jobs:
  run-alpha-engine:
    runs-on: ubuntu-latest
    
    # Ensures database writes don't conflict, although 15min window is safe
    concurrency:
      group: crypto-intelligence-bot
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: 📂 Restore SQLite Database Cache
        id: cache-db-restore
        uses: actions/cache/restore@v4
        with:
          path: alpha_brain_master.db
          # Restores the latest successful DB, or creates new on key miss
          key: Linux-alpha-db-v1-${{ github.run_id }}
          restore-keys: |
            Linux-alpha-db-v1-

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install requests

      - name: 🚀 Run Crypto Intelligence Bot OS
        env:
          # Securely fetch secrets from GitHub settings
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # Format: KEY1,KEY2,KEY3
        run: python main.py

      - name: 💾 Save SQLite Database Cache (On Success)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: alpha_brain_master.db
          # Saves with unique run ID key to ensure persistence across runs
          key: Linux-alpha-db-v1-${{ github.run_id }}
