name: Ultimate Web3 Alpha Bot Automation

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual run button anytime from GitHub UI

jobs:
  execute-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Web3 Alpha Engine Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python main.py

      - name: Persist SQLite Database History (Prevent Duplicate Posts)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update database history [skip ci]"
          file_pattern: "alpha_brain_master.db"
