name: Autonomous Web3 Alpha Engine

on:
  schedule:
    - cron: '*/15 * * * *'  # Trigger every 15 minutes
  workflow_dispatch:        # Manual run button in GitHub Actions UI

jobs:
  run-alpha-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Master Alpha Engine Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python main.py

      - name: Auto-Commit Database State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add alpha_brain_master.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update database state & logs [skip ci]" && git push)
