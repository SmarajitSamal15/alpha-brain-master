name: Crypto Intelligence Bot Automated 15-Min Runner

on:
  schedule:
    # Trigger every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual trigger support from GitHub UI

jobs:
  run-crypto-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Execute Master Crypto Intelligence Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python main.py

      - name: 💾 Commit & Push Updated Database (Deduplication Persistence)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_brain_master.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update database [skip ci]" && git push)
