name: 🚀 Web3 Alpha Engine 24/7 Auto-Runner

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

jobs:
  execute-alpha-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push updated SQLite DB back to repo

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ⚡ Run Web3 Alpha Engine Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python main.py

      - name: 💾 Commit & Save SQLite History DB (Duplicate Shield)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_brain_master.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update history db [skip ci]" && git push)
