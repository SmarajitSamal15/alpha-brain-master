name: Universal Web1-Web4 Alpha Intelligence Radar

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Enables manual trigger button in GitHub UI

jobs:
  run-radar-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit and push database changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Master Alpha Intelligence Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python main.py

      - name: Commit & Push Updated Database (Prevents Duplicate Posts)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add alpha_brain_master.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update deduplication database state [skip ci]" && git push)
